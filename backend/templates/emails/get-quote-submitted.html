<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Get Quote Request</title>
</head>
<body style="margin:0; padding:0; background:#ffffff; font-family:Arial, Helvetica, sans-serif; color:#1f2937;">
    <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="background:#ffffff; padding:28px 12px;">
        <tr>
            <td align="center">
                <table width="720" cellpadding="0" cellspacing="0" role="presentation" style="max-width:720px; width:100%; background:#ffffff; border:1px solid #e5e7eb; border-radius:16px; overflow:hidden;">
                    {{emailHeader}}
                    <tr>
                        <td style="padding:30px 30px 34px;">
                            <h1 style="font-size:24px; line-height:1.3; margin:0 0 22px; color:#111827;">New Get Quote Request</h1>
                            <table width="100%" cellpadding="0" cellspacing="0" role="presentation" style="border-collapse:separate; border-spacing:0; border:1px solid #e5e7eb; border-radius:14px; overflow:hidden;">
                                <tr><td style="width:210px; padding:13px 16px; border-bottom:1px solid #e5e7eb; background:#f8fafc; font-weight:700; font-size:13px; color:#111827;">Name</td><td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:13px; color:#374151;">{{fullName}}</td></tr>
                                <tr><td style="width:210px; padding:13px 16px; border-bottom:1px solid #e5e7eb; background:#f8fafc; font-weight:700; font-size:13px; color:#111827;">Email</td><td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:13px; color:#374151;">{{email}}</td></tr>
                                <tr><td style="width:210px; padding:13px 16px; border-bottom:1px solid #e5e7eb; background:#f8fafc; font-weight:700; font-size:13px; color:#111827;">Country</td><td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:13px; color:#374151;">{{countryDisplay}}</td></tr>
                                <tr><td style="width:210px; padding:13px 16px; border-bottom:1px solid #e5e7eb; background:#f8fafc; font-weight:700; font-size:13px; color:#111827;">Mobile</td><td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:13px; color:#374151;">{{mobileNumberDisplay}}</td></tr>
                                <tr><td style="width:210px; padding:13px 16px; border-bottom:1px solid #e5e7eb; background:#f8fafc; font-weight:700; font-size:13px; color:#111827;">Request Type</td><td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:13px; color:#374151;">Get Quote</td></tr>
                                <tr><td style="width:210px; padding:13px 16px; border-bottom:1px solid #e5e7eb; background:#f8fafc; font-weight:700; font-size:13px; color:#111827;">Submitted At</td><td style="padding:13px 16px; border-bottom:1px solid #e5e7eb; font-size:13px; color:#374151;">{{submittedAt}}</td></tr>
                                <tr><td style="width:210px; padding:13px 16px; background:#f8fafc; font-weight:700; font-size:13px; color:#111827;">Notes</td><td style="padding:13px 16px; font-size:13px; color:#374151;">{{message}}</td></tr>
                            </table>
                        </td>
                    </tr>
                    {{emailFooter}}
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
